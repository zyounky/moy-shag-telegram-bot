name: Release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/evaluate_scenarios.py

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: moyshag-ci
      DEMO_MODE: 'true'
      LLM_PROVIDER: 'none'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build both stages without cache
        run: |
          docker compose config --quiet
          docker compose build --no-cache
      - name: Check unprivileged demo and persistent SQLite
        run: |
          test "$(docker compose run --rm --no-deps -T --entrypoint id bot -u)" = 10001
          docker compose run --rm --no-deps -T catalog
          docker compose run --rm --no-deps -T bot --demo --check
          printf '/click lang:en\n/help\n' | docker compose run --rm --no-deps -T bot --demo > first-run.log
          grep -F 'Help and commands' first-run.log
          printf '/reminders\n' | docker compose run --rm --no-deps -T bot --demo > next-run.log
          grep -F 'My Next Step' next-run.log
          grep -F 'You have no active reminders.' next-run.log
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v
